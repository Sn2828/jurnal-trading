name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Jurnal Trading" com.jurnal.trading --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jurnal-trading-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

